{{- $type := .Params.realestates_types | default "sale" -}}
{{ with .Params.offer }}
  <div>
    {{ if not .hide_price }}
      {{ with .price }}
        <p class="pricing">
          {{- partial "func/GetHumanPrice" . -}}
          {{- if eq $type "rent" -}}
           / {{ i18n "realestates.month" | lower }}
          {{- end -}}
        </p>
      {{ end }}
    {{ end }}
  </div>
{{ end }}
